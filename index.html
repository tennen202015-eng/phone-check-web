<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D4450">
<title>فاحص الجوال</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root {
    --petrol: #0D4450;
    --mist: #EDF1F0;
    --paper: #FFFFFF;
    --ink: #14272C;
    --slate: #5E7076;
    --line: #E1E8E7;
    --pass: #1E8E5E;
    --pass-bg: #E2F3EB;
    --fail: #C7432E;
    --fail-bg: #FBE7E3;
    --dim: #B7D3D8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--mist); color: var(--ink); }
  body {
    font-family: "IBM Plex Sans Arabic", system-ui, sans-serif;
    font-size: 16px; line-height: 1.6;
    min-height: 100vh;
  }
  header {
    background: var(--petrol); color: #fff;
    padding: calc(16px + env(safe-area-inset-top)) 20px 22px;
    border-radius: 0 0 28px 28px;
  }
  header .app { color: var(--dim); font-weight: 600; font-size: 14px; }
  header h1 { margin: 2px 0 0; font-size: 22px; font-weight: 700; line-height: 1.35; }
  .progress { margin-top: 14px; height: 6px; background: rgba(255,255,255,.18); border-radius: 3px; overflow: hidden; }
  .progress i { display: block; height: 100%; background: #5BE3A8; border-radius: 3px; transition: width .35s ease; }
  .step { margin-top: 8px; color: var(--dim); font-size: 13px; }
  main { padding: 16px 16px calc(32px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; }
  .card { background: var(--paper); border-radius: 20px; padding: 20px 18px; }
  .card h2 { margin: 0 0 6px; font-size: 19px; font-weight: 700; }
  .card p { margin: 0 0 12px; color: var(--slate); font-size: 15px; }
  .btns { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  button {
    font: inherit; font-weight: 700; font-size: 16px;
    min-height: 52px; border-radius: 26px; border: 2px solid var(--petrol);
    background: var(--petrol); color: #fff; cursor: pointer; padding: 0 18px;
  }
  button.ghost { background: transparent; color: var(--petrol); }
  button.yes { background: var(--pass); border-color: var(--pass); }
  button.no { background: var(--fail); border-color: var(--fail); }
  button.link { background: none; border: none; color: var(--slate); font-weight: 600; min-height: 44px; }
  button:focus-visible { outline: 3px solid #5BE3A8; outline-offset: 2px; }
  label { display: block; font-weight: 600; font-size: 14px; margin: 14px 0 6px; }
  input {
    width: 100%; font: inherit; padding: 12px 14px; border-radius: 14px;
    border: 2px solid var(--line); background: var(--paper); color: var(--ink);
  }
  input:focus { outline: none; border-color: var(--petrol); }
  .meter { height: 12px; background: var(--line); border-radius: 6px; overflow: hidden; margin: 8px 0; }
  .meter i { display: block; height: 100%; width: 0; background: var(--pass); transition: width .08s linear; }
  .checks { list-style: none; padding: 0; margin: 10px 0 0; }
  .checks li { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
  .checks li:first-child { border-top: none; }
  .mark { width: 26px; height: 26px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex: none; }
  .mark.p { background: var(--pass-bg); color: var(--pass); }
  .mark.f { background: var(--fail-bg); color: var(--fail); }
  .mark.u { border: 2px solid var(--line); color: var(--slate); }
  .note { font-size: 13px; color: var(--slate); }
  video { width: 100%; border-radius: 14px; background: #000; aspect-ratio: 3/4; object-fit: cover; margin-top: 6px; }
  #qr { background: #fff; padding: 14px; border-radius: 16px; display: flex; justify-content: center; margin: 14px auto 6px; width: fit-content; border: 2px solid var(--line); }
  #qr img, #qr canvas { width: 240px !important; height: 240px !important; }
  .overlay { position: fixed; inset: 0; z-index: 10; touch-action: none; user-select: none; -webkit-user-select: none; }
  .overlay canvas { width: 100%; height: 100%; display: block; }
  .ohint {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px; pointer-events: none; font-size: 17px; font-weight: 600; color: #333;
  }
  .obtn {
    position: absolute; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    min-height: 44px; font-size: 14px; background: rgba(20,39,44,.85); border-color: transparent; white-space: nowrap;
    transition: opacity .2s;
  }
  .obtn.hide { opacity: 0; pointer-events: none; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <div class="app">فاحص الجوال</div>
  <h1 id="htitle">فحص سريع لهذا الجوال</h1>
  <div class="progress" id="prog" hidden><i id="progbar" style="width:0"></i></div>
  <div class="step" id="step"></div>
</header>
<main id="main"></main>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const main = $("#main");
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// النتائج: 1 سليم، 0 فيه مشكلة، "u" غير مدعوم في هذا المتصفح، "s" تم تخطيه
const results = {};
const info = { n: "", os: "", scr: "", cores: null, mem: null, bat: null };
let idx = -1;
let activeStreams = [];

const TESTS = [
  { k: "t",  title: "لمس الشاشة", run: testTouch },
  { k: "d",  title: "ألوان الشاشة والبكسلات", run: testDisplay },
  { k: "sp", title: "السماعة الخارجية", run: testSpeaker },
  { k: "mi", title: "المايكروفون", run: testMic },
  { k: "c",  title: "الكاميرا الخلفية", run: (done) => testCamera(done, "environment") },
  { k: "fc", title: "الكاميرا الأمامية", run: (done) => testCamera(done, "user") },
  { k: "fl", title: "الفلاش", run: testFlash },
  { k: "v",  title: "الاهتزاز", run: testVibration },
  { k: "mo", title: "حساسات الحركة", run: testMotion },
  { k: "ch", title: "منفذ الشحن", run: testCharging },
  { k: "g",  title: "الـ GPS", run: testGps },
];

// ---------- أدوات الواجهة ----------
function setHeader(title, stepText, ratio) {
  $("#htitle").textContent = title;
  $("#step").textContent = stepText || "";
  const p = $("#prog");
  if (ratio == null) { p.hidden = true; } else { p.hidden = false; $("#progbar").style.width = Math.round(ratio * 100) + "%"; }
}

function card(title, body, buttons) {
  main.innerHTML = `<div class="card"><h2>${esc(title)}</h2>${body}<div class="btns" id="btns"></div></div>`;
  const box = $("#btns");
  (buttons || []).forEach((b) => {
    if (Array.isArray(b)) {
      const row = document.createElement("div");
      row.className = "row";
      b.forEach((x) => row.appendChild(makeBtn(x)));
      box.appendChild(row);
    } else box.appendChild(makeBtn(b));
  });
}

function makeBtn(b) {
  const el = document.createElement("button");
  el.textContent = b.label;
  if (b.cls) el.className = b.cls;
  el.addEventListener("click", b.on);
  return el;
}

function ask(title, text, done, extra) {
  card(title, `<p>${text}</p>${extra || ""}`, [
    [{ label: "نعم", cls: "yes", on: () => done(1) }, { label: "لا", cls: "no", on: () => done(0) }],
    { label: "تخطّي", cls: "link", on: () => done("s") },
  ]);
}

function stopStreams() {
  activeStreams.forEach((s) => s.getTracks().forEach((t) => t.stop()));
  activeStreams = [];
}

function overlay(bg) {
  const o = document.createElement("div");
  o.className = "overlay";
  o.style.background = bg;
  document.body.appendChild(o);
  try { document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(() => {}); } catch (e) {}
  return o;
}

function closeOverlay(o) {
  o.remove();
  try { if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); } catch (e) {}
}

// ---------- البداية ----------
async function start() {
  setHeader("فحص سريع لهذا الجوال", "", null);
  await collectInfo();
  card("قبل ما نبدأ",
    `<p>بنسوي ${TESTS.length} اختبارات سريعة على هذا الجوال من المتصفح، بدون تثبيت أي تطبيق. في النهاية يطلع رمز يمسحه الفاحص من تطبيق فاحص الجوال.</p>
     <p class="note">بيطلب المتصفح إذن الكاميرا والمايك والموقع وقت الاختبار. الصور والصوت ما تنحفظ ولا تطلع من الجوال.</p>
     <label for="model">موديل الجوال</label>
     <input id="model" value="${esc(info.n)}" placeholder="مثلاً: iPhone 13 Pro 256GB" autocomplete="off">`,
    [{ label: "ابدأ الفحص", on: () => { info.n = ($("#model").value || "").trim().slice(0, 60); next(); } }]);
}

async function collectInfo() {
  const ua = navigator.userAgent;
  const dpr = window.devicePixelRatio || 1;
  info.scr = Math.round(screen.width * dpr) + "x" + Math.round(screen.height * dpr);
  info.cores = navigator.hardwareConcurrency || null;
  info.mem = navigator.deviceMemory || null;
  let m;
  if ((m = ua.match(/Android\s([\d.]+)/))) info.os = "Android " + m[1];
  else if ((m = ua.match(/OS (\d+[_\d]*) like Mac OS X/))) info.os = "iOS " + m[1].replace(/_/g, ".");
  if (/iPhone/.test(ua)) info.n = "iPhone";
  try {
    if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
      const h = await navigator.userAgentData.getHighEntropyValues(["model", "platformVersion"]);
      if (h.model) info.n = h.model;
      if (h.platformVersion && /Android/.test(ua)) info.os = "Android " + h.platformVersion.split(".")[0];
    }
  } catch (e) {}
  try {
    if (navigator.getBattery) {
      const b = await navigator.getBattery();
      info.bat = Math.round(b.level * 100);
    }
  } catch (e) {}
}

function next() {
  stopStreams();
  idx++;
  if (idx >= TESTS.length) return finish();
  const t = TESTS[idx];
  setHeader(t.title, `اختبار ${idx + 1} من ${TESTS.length}`, idx / TESTS.length);
  window.scrollTo(0, 0);
  t.run((status) => { results[t.k] = status; next(); });
}

// ---------- الاختبارات ----------
function testTouch(done) {
  card("لمس الشاشة", `<p>بتصير الشاشة شبكة مربعات. مرّر إصبعك على كل المربعات لين تصير كلها خضراء.</p>`,
    [{ label: "ابدأ", on: run }, { label: "تخطّي", cls: "link", on: () => done("s") }]);

  function run() {
    const o = overlay("#fff");
    const cv = document.createElement("canvas");
    o.appendChild(cv);
    const hint = document.createElement("div");
    hint.className = "ohint";
    hint.textContent = "مرّر إصبعك على كل المربعات";
    o.appendChild(hint);
    const fail = document.createElement("button");
    fail.className = "obtn hide";
    fail.textContent = "فيه منطقة ما تستجيب";
    o.appendChild(fail);

    const cols = 8, rows = 14;
    const cells = new Array(cols * rows).fill(false);
    let count = 0, finished = false, idleTimer = null;
    const dpr = window.devicePixelRatio || 1;
    const ctx = cv.getContext("2d");

    function size() {
      cv.width = o.clientWidth * dpr;
      cv.height = o.clientHeight * dpr;
      draw();
    }
    function draw() {
      const cw = cv.width / cols, ch = cv.height / rows;
      ctx.clearRect(0, 0, cv.width, cv.height);
      ctx.lineWidth = 1 * dpr;
      ctx.strokeStyle = "#D3DBDA";
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
        if (cells[r * cols + c]) { ctx.fillStyle = "#43A047"; ctx.fillRect(c * cw, r * ch, cw, ch); }
        ctx.strokeRect(c * cw, r * ch, cw, ch);
      }
    }
    function mark(x, y) {
      const c = Math.min(cols - 1, Math.max(0, Math.floor(x / (o.clientWidth / cols))));
      const r = Math.min(rows - 1, Math.max(0, Math.floor(y / (o.clientHeight / rows))));
      const i = r * cols + c;
      if (!cells[i]) { cells[i] = true; count++; }
    }
    function idle() {
      fail.classList.add("hide");
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => fail.classList.remove("hide"), 3000);
    }
    function onMove(e) {
      if (finished) return;
      e.preventDefault();
      hint.style.display = "none";
      const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
      (evs.length ? evs : [e]).forEach((ev) => mark(ev.clientX, ev.clientY));
      draw();
      idle();
      if (count === cols * rows) {
        finished = true;
        setTimeout(() => { closeOverlay(o); done(1); }, 300);
      }
    }
    o.addEventListener("pointerdown", onMove);
    o.addEventListener("pointermove", (e) => { if (e.buttons || e.pointerType === "touch") onMove(e); });
    fail.addEventListener("pointerdown", (e) => e.stopPropagation());
    fail.addEventListener("click", (e) => { e.stopPropagation(); finished = true; clearTimeout(idleTimer); closeOverlay(o); done(0); });
    window.addEventListener("resize", size);
    size();
    idle();
  }
}

function testDisplay(done) {
  const colors = ["#FF0000", "#00FF00", "#0000FF", "#FFFFFF", "#000000", "#808080"];
  card("ألوان الشاشة", `<p>بتتلون الشاشة بألوان كاملة. اضغط على الشاشة عشان تنتقل للون الجاي، ودقّق في كل لون: فيه نقاط ميتة أو خطوط أو بقع؟</p>`,
    [{ label: "ابدأ", on: run }, { label: "تخطّي", cls: "link", on: () => done("s") }]);

  function run() {
    let i = 0;
    const o = overlay(colors[0]);
    o.addEventListener("click", () => {
      i++;
      if (i >= colors.length) {
        closeOverlay(o);
        card("ألوان الشاشة", `<p>هل لاحظت نقاط ميتة أو خطوط أو بقع أو اختلاف في الألوان؟</p>`, [
          [{ label: "لا، سليمة", cls: "yes", on: () => done(1) }, { label: "نعم، فيه مشكلة", cls: "no", on: () => done(0) }],
          { label: "إعادة", cls: "ghost", on: run },
        ]);
      } else o.style.background = colors[i];
    });
  }
}

function testSpeaker(done) {
  card("السماعة الخارجية", `<p>ارفع صوت الجوال، وتأكد إن الوضع الصامت مقفل، ثم اضغط تشغيل.</p>`,
    [{ label: "شغّل النغمة", on: play }, { label: "تخطّي", cls: "link", on: () => done("s") }]);

  function play() {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      const ac = new AC();
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = "sine";
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.0001, ac.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.6, ac.currentTime + 0.05);
      gain.gain.setValueAtTime(0.6, ac.currentTime + 2);
      gain.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + 2.2);
      osc.connect(gain).connect(ac.destination);
      osc.start();
      osc.stop(ac.currentTime + 2.3);
      osc.onended = () => ac.close();
    } catch (e) {}
    card("السماعة الخارجية", `<p>هل سمعت النغمة بوضوح وبدون تشويش؟</p>`, [
      [{ label: "نعم", cls: "yes", on: () => done(1) }, { label: "لا", cls: "no", on: () => done(0) }],
      { label: "شغّلها مرة ثانية", cls: "ghost", on: play },
    ]);
  }
}

function testMic(done) {
  card("المايكروفون", `<p>اضغط ابدأ، ثم تكلّم بصوت واضح قرب أسفل الجوال لمدة 3 ثوانٍ.</p>`,
    [{ label: "ابدأ", on: run }, { label: "تخطّي", cls: "link", on: () => done("s") }]);

  async function run() {
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) {
      return card("المايكروفون", `<p>ما قدرنا نشغّل المايك. تأكد إنك سمحت للمتصفح باستخدامه.</p>`, [
        { label: "إعادة", on: run },
        [{ label: "المايك ما يشتغل", cls: "no", on: () => done(0) }, { label: "تخطّي", cls: "ghost", on: () => done("s") }],
      ]);
    }
    activeStreams.push(stream);
    card("المايكروفون", `<p>تكلّم الحين…</p><div class="meter"><i id="lvl"></i></div>`, []);
    const AC = window.AudioContext || window.webkitAudioContext;
    const ac = new AC();
    const src = ac.createMediaStreamSource(stream);
    const an = ac.createAnalyser();
    an.fftSize = 2048;
    src.connect(an);
    const buf = new Float32Array(an.fftSize);
    let peak = 0;
    const end = performance.now() + 3000;
    (function loop() {
      an.getFloatTimeDomainData(buf);
      let p = 0;
      for (let i = 0; i < buf.length; i++) p = Math.max(p, Math.abs(buf[i]));
      peak = Math.max(peak, p);
      const lvl = $("#lvl");
      if (lvl) lvl.style.width = Math.min(100, p * 300) + "%";
      if (performance.now() < end) requestAnimationFrame(loop);
      else {
        stopStreams();
        ac.close();
        const ok = peak > 0.08;
        card("المايكروفون",
          ok ? `<p>المايك يلتقط الصوت بشكل جيد ✓</p>` : `<p>الصوت الملتقط ضعيف جداً. تأكد إنك تكلمت قرب المايك، أو أعد الاختبار.</p>`,
          [{ label: "التالي", on: () => done(ok ? 1 : 0) }, { label: "إعادة", cls: "ghost", on: run }]);
      }
    })();
  }
}

function testCamera(done, facing) {
  const title = facing === "user" ? "الكاميرا الأمامية" : "الكاميرا الخلفية";
  card(title, `<p>اضغط فتح الكاميرا، وتأكد إن الصورة واضحة وبدون بقع أو غباش.</p>`,
    [{ label: "فتح الكاميرا", on: run }, { label: "تخطّي", cls: "link", on: () => done("s") }]);

  async function run() {
    stopStreams();
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: facing } }, audio: false });
    } catch (e) {
      return card(title, `<p>ما قدرنا نفتح الكاميرا. تأكد إنك سمحت للمتصفح باستخدامها.</p>`, [
        { label: "إعادة", on: run },
        [{ label: "الكاميرا ما تشتغل", cls: "no", on: () => done(0) }, { label: "تخطّي", cls: "ghost", on: () => done("s") }],
      ]);
    }
    activeStreams.push(stream);
    ask(title, "هل الصورة واضحة وبدون بقع أو غباش؟", done, `<video id="vid" playsinline muted autoplay></video>`);
    const v = $("#vid");
    v.srcObject = stream;
    v.play().catch(() => {});
  }
}

function testFlash(done) {
  const manual = () => ask("الفلاش", "متصفح هذا الجوال ما يسمح بتشغيل الفلاش. شغّله يدوياً من الإعدادات السريعة: هل يشتغل؟", done);
  card("الفلاش", `<p>بنحاول نشغّل الفلاش الخلفي.</p>`,
    [{ label: "شغّل الفلاش", on: run }, { label: "تخطّي", cls: "link", on: () => done("s") }]);

  async function run() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } }, audio: false });
      activeStreams.push(stream);
      const track = stream.getVideoTracks()[0];
      const caps = track.getCapabilities ? track.getCapabilities() : {};
      if (!caps.torch) return manual();
      await track.applyConstraints({ advanced: [{ torch: true }] });
      ask("الفلاش", "شغّلنا الفلاش الخلفي. هل هو شغّال؟", done);
    } catch (e) {
      manual();
    }
  }
}

function testVibration(done) {
  if (!navigator.vibrate) {
    card("الاهتزاز", `<p>متصفح هذا الجوال ما يدعم اختبار الاهتزاز. فعّل الاهتزاز من الإعدادات واختبره يدوياً لو تبي.</p>`,
      [{ label: "التالي", on: () => done("u") }]);
    return;
  }
  card("الاهتزاز", `<p>اضغط ابدأ وانتبه للاهتزاز.</p>`,
    [{ label: "ابدأ", on: run }, { label: "تخطّي", cls: "link", on: () => done("s") }]);
  function run() {
    navigator.vibrate([500, 200, 500, 200, 500]);
    card("الاهتزاز", `<p>هل حسّيت بالاهتزاز؟</p>`, [
      [{ label: "نعم", cls: "yes", on: () => done(1) }, { label: "لا", cls: "no", on: () => done(0) }],
      { label: "مرة ثانية", cls: "ghost", on: run },
    ]);
  }
}

function testMotion(done) {
  card("حساسات الحركة", `<p>اضغط ابدأ، ثم حرّك الجوال بقوة وقلّبه في يدك.</p>`,
    [{ label: "ابدأ", on: run }, { label: "تخطّي", cls: "link", on: () => done("s") }]);

  async function run() {
    try {
      if (window.DeviceMotionEvent && typeof DeviceMotionEvent.requestPermission === "function") {
        const p = await DeviceMotionEvent.requestPermission();
        if (p !== "granted") throw new Error("denied");
      }
    } catch (e) {
      return card("حساسات الحركة", `<p>ما سمح المتصفح بقراءة الحساسات.</p>`, [
        { label: "إعادة", on: run }, { label: "تخطّي", cls: "link", on: () => done("s") },
      ]);
    }
    let minA = Infinity, maxA = 0, accOk = false, gyroOk = false, gyroSeen = false, any = false, finished = false;
    const render = () => {
      card("حساسات الحركة", `<p>حرّك الجوال وقلّبه…</p><ul class="checks">
        <li><span class="mark ${accOk ? "p" : "u"}">${accOk ? "✓" : ""}</span>حساس التسارع</li>
        <li><span class="mark ${gyroOk ? "p" : "u"}">${gyroOk ? "✓" : ""}</span>الجيروسكوب</li></ul>`,
        [{ label: "ما يستجيب", cls: "ghost", on: () => finish(0) }]);
    };
    const h = (e) => {
      any = true;
      const a = e.accelerationIncludingGravity;
      if (a && a.x != null) {
        const m = Math.sqrt(a.x * a.x + a.y * a.y + a.z * a.z);
        minA = Math.min(minA, m); maxA = Math.max(maxA, m);
        if (maxA - minA > 6 && !accOk) { accOk = true; render(); }
      }
      const r = e.rotationRate;
      if (r && r.alpha != null) {
        gyroSeen = true;
        const m = Math.sqrt(r.alpha * r.alpha + r.beta * r.beta + r.gamma * r.gamma);
        if (m > 120 && !gyroOk) { gyroOk = true; render(); }
      }
      if (accOk && (gyroOk || !gyroSeen)) finish(1);
    };
    function finish(s) {
      if (finished) return;
      finished = true;
      window.removeEventListener("devicemotion", h);
      done(s);
    }
    window.addEventListener("devicemotion", h);
    render();
    setTimeout(() => {
      if (!any && !finished) {
        finished = true;
        window.removeEventListener("devicemotion", h);
        card("حساسات الحركة", `<p>ما وصلت أي قراءة من الحساسات.</p>`, [
          { label: "إعادة", on: () => testMotion(done) },
          [{ label: "ما تشتغل", cls: "no", on: () => done(0) }, { label: "تخطّي", cls: "ghost", on: () => done("s") }],
        ]);
      }
    }, 4000);
  }
}

async function testCharging(done) {
  let b = null;
  try { if (navigator.getBattery) b = await navigator.getBattery(); } catch (e) {}
  if (!b) {
    card("منفذ الشحن", `<p>متصفح هذا الجوال ما يسمح بقراءة حالة الشحن. وصّل الشاحن وتأكد إن رمز الشحن يظهر: هل يشحن؟</p>`, [
      [{ label: "نعم", cls: "yes", on: () => done(1) }, { label: "لا", cls: "no", on: () => done(0) }],
      { label: "تخطّي", cls: "link", on: () => done("s") },
    ]);
    return;
  }
  let finished = false;
  const ok = () => {
    if (finished) return;
    finished = true;
    b.removeEventListener("chargingchange", onChange);
    card("منفذ الشحن", `<p>الشحن شغّال ✓<br>نسبة البطارية: ${Math.round(b.level * 100)}%</p>`, [{ label: "التالي", on: () => done(1) }]);
  };
  const onChange = () => { if (b.charging) ok(); };
  if (b.charging) return ok();
  b.addEventListener("chargingchange", onChange);
  card("منفذ الشحن", `<p>وصّل الشاحن الآن… بنكشف التوصيل تلقائياً.</p>`, [
    { label: "ما يشحن", cls: "no", on: () => { finished = true; b.removeEventListener("chargingchange", onChange); done(0); } },
    { label: "تخطّي", cls: "link", on: () => { finished = true; b.removeEventListener("chargingchange", onChange); done("s"); } },
  ]);
}

function testGps(done) {
  if (!navigator.geolocation) {
    card("الـ GPS", `<p>المتصفح ما يدعم تحديد الموقع.</p>`, [{ label: "التالي", on: () => done("u") }]);
    return;
  }
  card("الـ GPS", `<p>اضغط ابدأ واسمح بالموقع. الأفضل تكون قرب نافذة أو برّا. الموقع ما ينحفظ ولا يطلع من الجوال.</p>`,
    [{ label: "ابدأ", on: run }, { label: "تخطّي", cls: "link", on: () => done("s") }]);

  function run() {
    card("الـ GPS", `<p>جاري تحديد الموقع…</p>`, []);
    navigator.geolocation.getCurrentPosition(
      (p) => {
        const acc = Math.round(p.coords.accuracy);
        const good = acc <= 150;
        card("الـ GPS",
          good ? `<p>الـ GPS شغّال ✓<br>الدقة: ${acc} متر</p>` : `<p>الدقة ضعيفة (${acc} متر). جرّب قرب نافذة أو برّا.</p>`,
          [{ label: "التالي", on: () => done(good ? 1 : 0) }, { label: "إعادة", cls: "ghost", on: run }]);
      },
      () => {
        card("الـ GPS", `<p>ما قدرنا نحدد الموقع. تأكد إن الموقع مفعّل وإنك سمحت للمتصفح.</p>`, [
          { label: "إعادة", on: run },
          [{ label: "الـ GPS ما يشتغل", cls: "no", on: () => done(0) }, { label: "تخطّي", cls: "ghost", on: () => done("s") }],
        ]);
      },
      { enableHighAccuracy: true, timeout: 30000, maximumAge: 0 }
    );
  }
}

// ---------- النهاية ----------
function b64url(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = "";
  bytes.forEach((x) => (bin += String.fromCharCode(x)));
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

function finish() {
  stopStreams();
  setHeader("اكتمل الفحص", "", 1);
  const r = {};
  TESTS.forEach((t) => { const s = results[t.k]; if (s === 1 || s === 0) r[t.k] = s; });
  const payload = { v: 1, n: info.n, os: info.os, scr: info.scr, cores: info.cores, mem: info.mem, bat: info.bat, r: r, ts: Date.now() };
  const code = "PCK1." + b64url(JSON.stringify(payload));

  const rows = TESTS.map((t) => {
    const s = results[t.k];
    const cls = s === 1 ? "p" : s === 0 ? "f" : "u";
    const sym = s === 1 ? "✓" : s === 0 ? "✕" : "";
    const note = s === "u" ? ` <span class="note">(غير مدعوم في المتصفح)</span>` : s === "s" ? ` <span class="note">(تم تخطيه)</span>` : "";
    return `<li><span class="mark ${cls}">${sym}</span><span>${esc(t.title)}${note}</span></li>`;
  }).join("");

  card("خلّ الفاحص يمسح هذا الرمز",
    `<p>افتح تطبيق فاحص الجوال على الجوال الثاني، واختر "فحص جوال ثاني" ثم "امسح النتيجة".</p>
     <div id="qr"></div><ul class="checks">${rows}</ul>`,
    [{ label: "أعد الفحص من البداية", cls: "ghost", on: () => { Object.keys(results).forEach((k) => delete results[k]); idx = -1; start(); } }]);

  try {
    new QRCode($("#qr"), { text: code, width: 480, height: 480, correctLevel: QRCode.CorrectLevel.M });
  } catch (e) {
    $("#qr").innerHTML = `<p class="note">تعذّر إنشاء الرمز. تأكد من اتصال الإنترنت وحدّث الصفحة.</p>`;
  }
}

start();
</script>
